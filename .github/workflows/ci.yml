name: Demo CI

on:
  pull_request:

jobs:
  demo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check demo status
        run: |
          if [ -f FAIL_CI ]; then
            echo "Intentional demo failure"
            exit 1
          fi

          echo "Demo CI passed"
